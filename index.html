<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        
    </head>
    <body>

        <div class="app-container">
            <h1>Scoreboard</h1>

            <div class="teams-container">
                <div class="lakersTeam-container">
                    <img class="teamsLogo" id="lakersIcon" src="./imgs/Los_Angeles_Lakers_logo.svg.png" alt="Los Angeles Lakers Logo">
                    <h1 class="teamsName">LAL</h1>
                    <div class="buttons-container">
                        <button id="plus-one-btn-left" class="pointsAdditionBtn" onclick="addOneLeft()">+1</button>
                        <button id="plus-two-btn-left" class="pointsAdditionBtn"  onclick="addTwoLeft()">+2</button>
                        <button id="plus-three-btn-left" class="pointsAdditionBtn" onclick="addThreeLeft()">+3</button>
                    </div>
                </div>

                <div class="scoreboard-container">
                    <h1 class="TeamsScore" id="leftScore">0</h1>
                    <h1 class="TeamsScore" id="rightScore">0</h1>
                </div>

                <div class="wolvesTeam-container">
                    <div class="lakersLogoNdAbv">
                        <img class="teamsLogo" id="wolvesIcon"  src="./imgs/minnesota-timberwolves-logo-transparent.png" alt="Minnesota-timberwolves-logo">
                        <h1 class="teamsName">MIN</h1>
                        <div class="buttons-container">
                            <button id="plus-one-btn-right" onclick="addOneRight()">+1</button>
                            <button id="plus-two-btn-right" onclick="addTwoRight()">+2</button>
                            <button id="plus-three-btn-right" onclick="addThreeRight()">+3</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="gameTimeStamp-container">
                <div class="gameTimeStamp">
                    <div class="quarter-container">
                        <h3>1st</h3>
                    </div>
                    <div class="quarterTimeLeft" id="qTimeLeft">
                        <h3 id="qrTime">12.0</h3>
                    </div>
                    <div class="shotClock-container" id="shotClock">
                        <h3 id="shotClock">24</h3>
                    </div>
                </div>
            </div>

            <!-- <div class="buttons-container">
                <button id="plus-one-btn" onclick="addTOne()">+1</button>
                <button id="plus-two-btn" onclick="addTwo()">+2</button>
                <button id="plus-three-btn" onclick="addThree()">+3</button>
            </div> -->
        </div>

        <div class="startMatch-wrapper">
            <div class="startMatchButton-container">
                <button class="startMatchBtn" id="startMatch" onclick="execStartTimer()">Start</button>
            </div>
        </div>

        <div id="gameAndGameControl-container">
            <div class="gameplayer">
                <video src="https://cdn.nba.com/videos/teams/wsc-feed/media/team/timberwolves/2025/05/01/no-game/25D7F1C49180FD1AC33C11EB184CA799ECFB1DC6_1280x720.mp4" controls loop >
    
                </video>
            </div>
            

            <div class="controlesPontos-wrapper">
                <div class="controlesPontos-container">
    
                    <div id="controlePontoEsq" class="controlePontos">
                        <div id="buttons-container-controle" class="buttons-container">
                            <span class="scoringOptions">
                                <button id="plus-one-btn-left" class="pointsAdditionBtn" onclick="addOneLeft()">+1</button><label for="plus-one-btn-left">1 PONTO</label>
                            </span>
                            
                            <span class="scoringOptions">
                                <button id="plus-two-btn-left" class="pointsAdditionBtn"  onclick="addTwoLeft()">+2</button><label for="plus-two-btn-left">2 PONTOS</label>
                            </span>
    
                            <span class="scoringOptions">
                                <button id="plus-three-btn-left" class="pointsAdditionBtn" onclick="addThreeLeft()">+3</button><label for="plus-three-btn-left">3 PONTOS</label>
                            </span>
                        </div>
                    </div>
    
                    <div id="ControlePontoDir" class="controlePontos">
                        <div id="buttons-container-controle" class="buttons-container">
                            <span class="scoringOptions">
                                <button id="plus-one-btn-right" class="pointsAdditionBtn" onclick="addOneRight()">+1</button><label for="plus-one-btn-right">1 PONTO</label>
                            </span>
                            
                            <span class="scoringOptions">
                                <button id="plus-two-btn-right" class="pointsAdditionBtn"  onclick="addTwoRight()">+2</button><label for="plus-two-btn-right">2 PONTOS</label>
                            </span>
    
                            <span class="scoringOptions">
                                <button id="plus-three-btn-right" class="pointsAdditionBtn" onclick="addThreeRight()">+3</button><label for="plus-three-btn-right">3 PONTOS</label>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="./main.js"></script>
    </body>

</html>
